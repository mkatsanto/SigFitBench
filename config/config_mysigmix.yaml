# ============================================================================
# SigFitTest Workflow Configuration — config_mysigmix.yaml
# Example "custom" + "synthetic" run: a MySigMix custom dataset drawing from
# config10.tsv as the signature combinations file, alongside a small standard
# synthetic run. See README.md for full documentation.
# ============================================================================

# ============================================================================
# CORE SETTINGS — always required, regardless of data source
# ============================================================================

tools_to_run: [ "SPA", "SPA_low", "MuSiCal",  "siglasso"] #,"SigNoise", "FSPA", "mSigAct",] # "StarSignDNA"] #, "mmsig"]
 
data_types: ["custom", "synthetic"]      # which DATA SOURCE section(s) below are active:
                                          # "synthetic", "realsim", "external", "custom"
                                          # (combine more than one to run several in one config,
                                          # as this file does)

relevance_modes: ["standard"]            # "standard", "relevant", or both

output_dir: "results_test1"
log_dir: "logs_test"
random_seed: 6

# ============================================================================
# DATA SOURCE 1/4 — "synthetic": simulate samples from empirical COSMIC tissue
# distributions, with known ground truth. Active (data_types above includes it).
# num_muts/num_samples/num_realizations/out_of_reference_* below are also read
# by "custom" (DATA SOURCE 4/4) — both data sources share these top-level keys.
# ============================================================================

# Available WGS cancer types: Breast, CNS-GBM, ColoRect-AdenoCA, Eso-AdenoCA, Head-SCC,
#   Liver-HCC, Lung-AdenoCA, Lymph-BNHL, Ovary-AdenoCA, Panc-AdenoCA, Skin-Melanoma, Stomach-AdenoCA
cancer_types: ["Breast", "CNS-GBM", "ColoRect-AdenoCA", "Eso-AdenoCA", "Head-SCC", "Liver-HCC", "Lung-AdenoCA","Lymph-BNHL", "Ovary-AdenoCA", "Panc-AdenoCA", "Skin-Melanoma", "Stomach-AdenoCA"]

num_muts: [200, 500, 1000, 2000, 4000, 8400, 15000, 30000, 50000, 200000, 500000]   # mutations per sample
num_samples: 100
num_realizations: 1

# Unknown signatures: excluded from the fitting reference, included in simulation
out_of_reference_sigs: ["SBS10c", "SBS10d", "SBS86", "SBS87", "SBS88", "SBS89", "SBS90", "SBS91", "SBS92", "SBS93", "SBS94", "SBS95"]
out_of_reference_weights: [0]          # fraction of mutations from unknown sigs

# ============================================================================
# DATA SOURCE 2/4 — "realsim": real PCAWG samples, split per tissue, at their
# native mutation count (no downsampling, no ground truth — evaluated via
# cross-tool agreement). Inactive here (not in data_types above).
# ============================================================================

# simulation:
#   real_samples:
#     input_real_catalog: "real_mutational_catalogs/real_samples_WGS_PCAWG-146_input_profiles.dat"
#     cancer_types: ["Breast-AdenoCA", "Skin-Melanoma"]
#     # Available in that file: Biliary-AdenoCA, Bladder-TCC, Breast-AdenoCA, CNS-GBM,
#     # ColoRect-AdenoCA, Eso-AdenoCA, Head-SCC, Liver-HCC, Lung-AdenoCA, Lung-SCC,
#     # Lymph-BNHL, Panc-AdenoCA, Skin-Melanoma, Stomach-AdenoCA, Uterus-AdenoCA

# ============================================================================
# DATA SOURCE 3/4 — "external": bring your own real catalog, all samples
# fit as one flat dataset (no per-tissue splitting like realsim — use that
# instead if you want the split). No ground truth, cross-tool agreement only.
# Inactive here (not in data_types above).
# ============================================================================

# external_datasets:
#   MyDataset:
#     catalog: "input/my_catalog.dat"   # contexts x samples TSV/CSV; column headers become sample names verbatim

# ============================================================================
# DATA SOURCE 4/4 — "custom": fully synthetic, drawn from your own precalculated
# table of signature-weight combinations (real ground truth, same evaluation
# path as "synthetic"). Active (data_types above includes it).
# ============================================================================
# Each dataset needs a 'combinations_file' (rows = samples, columns = signatures).
# Each row becomes one sample. See README.md "Data Types" for the file format.

custom_datasets:
  MySigMix:
    combinations_file: "input/mysigmix/config10.tsv"
    signature_file: "input/COSMIC_v3.4_SBS_GRCh38.txt"   # optional; default: cosmic_signatures.base_file

# ============================================================================
# BOILERPLATE — required by the Snakefile regardless of which data source(s)
# above are active (every rule for every data source gets parsed on every run)
# ============================================================================

input_dir: "input"
signature_contributions_dir: "cosmic_tissue_data"

cosmic_signatures:
  base_file: "input/COSMIC_v3.3.1_SBS_GRCh38.txt"

epsilon: 0.00000001
wgs_or_wes: "WGS"
matrix_order: "input/mut_matrix_order_MutationalPatterns.dat"

# relevant_signatures: "auto" | [manual signature list] | null (skip relevant mode)
relevant_signatures: null

relevant_detection:
  min_contribution: 10.0
  min_sample_fraction: 0.3
  min_avg_contribution: 50.0
  consensus_tools: 2

evaluation:
  min_contribution: 10          # predicted signatures with fewer mutations count as not found
  run_bootstrap_quality: false    # computationally intensive — under development
  num_bootstrap: 1                # 50 testing / 100 standard / 1000 publication

tool_overrides:
  sigminer:
    method: "NNLS"  # options: "NNLS" (default), "QP" (quadratic programming), "SA" (simulated annealing)
  mutationalpatterns:
    strict: false
  spa:
    output_temp_dir: "temp_spa"
  msigact:
    max_level: 2                       # remove up to this many signatures at once when testing (higher = slower)
    p_thresh: 0.05                     # a signature is removed only if the likelihood-ratio test p-value is >= this
    likelihood: "neg.binom"            # "neg.binom" (mSigAct default) or "multinom"
    threads: 2                         # cores per job (mSigAct tests signature subsets in parallel)
  starsigndna:
    n_iterations: 1000                 # optimisation iterations (StarSignDNA default)
  signoise:
    noise_z: 15                        # ADD a signature only if its squared-error drop is >= this x noise per direction (best of ~60 candidates)
    removal_z: 12                      # KEEP a signature in the model if removing it costs >= this x noise per direction (single test)
    min_explained_share: 0.1           # ...and it explains >= this share of the non-noise residual
    background_signatures: ["SBS1", "SBS5"]   # always kept, as in SPA ([] = none)
    #connected_signatures: true         # add the rest of a group (SBS2/13, SBS7a-d, SBS10a/b, SBS17a/b) if one member is selected, as in SPA
    weighted_fit: true                 # true = weight each channel by its counting noise (chi-square fit); false = plain L2 fit
    noise_dispersion: 0           # extra noise per channel = this x expected^2 (0 = counting noise only, no effect)
    poisson_deviance: true             # with weighted_fit: decide on the Poisson (or negative-binomial) deviance instead of the chi-square
  musical: {}
  sigtrim:
    zscore_threshold: 1.0
    thresh_backward: 0.01  # L2 distance threshold for backward elimination
    thresh_forward: 0.01   # minimum score improvement for a greedy add layer to continue
    initial_remove_penalty: 0.05  # coarse pre-filter threshold before the add/remove loop
    max_iter: 1000
    prune_signatures_flag: true
  sigid:
    thresh_backward: 0.001
    max_iter: 1000
    min_penalty: 0.00001
    max_penalty: 1000

tool_formats:
  tab_with_index:
    tools: ["deconstructsigs", "spa", "spa_low", "fspa", "signoise", "msigact", "starsigndna"]
    input_data_base: "data/data_for_deconstructSigs.dat"
    cosmic_signatures:
      standard: "{output_dir}/cosmic_signatures/COSMIC_v3_SBS_GRCh38_tab_with_index.txt"

  csv_no_index:
    tools: ["mutationalpatterns", "musical", "sigtrim", "sigid"]
    input_data_base: "data/data_for_MutationalPatterns.dat"
    cosmic_signatures:
      standard: "{output_dir}/cosmic_signatures/COSMIC_v3_SBS_GRCh38_tab_with_index.txt"

  csv_with_index:
    tools: ["sigfit", "mmsig", "sigminer", "sigspack", "yapsa"]
    input_data_base: "data/data_for_sigfit.dat"
    cosmic_signatures:
      standard: "{output_dir}/cosmic_signatures/COSMIC_v3_SBS_GRCh38_csv_with_index.txt"

  csv_quoted:
    tools: ["siglasso"]
    input_data_base: "data/data_for_sigLASSO.dat"
    cosmic_signatures:
      standard: "{output_dir}/cosmic_signatures/COSMIC_v3_SBS_GRCh38_csv_quoted.txt"

  signature_tools:
    tools: ["signature_tools"]
    input_data_base: "data/data_for_signature_tools.dat"
    cosmic_signatures:
      standard: "{output_dir}/cosmic_signatures/COSMIC_v3_SBS_GRCh38_tab_with_index.txt"
