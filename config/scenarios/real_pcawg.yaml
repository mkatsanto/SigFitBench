# ============================================================================
# Scenario: real PCAWG tumours
# Fits real whole-genome samples from PCAWG, split by tumour type, at their
# own mutation counts. There is no known answer, so the tools are compared
# with each other.
#
# Needs the PCAWG catalog, which is not part of this repository. Put it at
# the path given in catalog below.
#
#   snakemake --profile profiles/local-conda --snakefile workflow/Snakefile \
#     --configfile config/scenarios/real_pcawg.yaml
#
# Guide: docs/guide.md#real-pcawg
# ============================================================================

tools_to_run: ["MutationalPatterns", "deconstructSigs", "SPA", "MuSiCal", "sigminer"]

data_types: ["real"]
relevance_modes: ["standard"]

real_datasets:
  PCAWG:
    catalog: "real_mutational_catalogs/real_samples_WGS_PCAWG-146_input_profiles.dat"
    # Only these tumour types; leave cancer_types out to fit every one in the file:
    # Biliary-AdenoCA, Bladder-TCC, Breast-AdenoCA, CNS-GBM, ColoRect-AdenoCA,
    # Eso-AdenoCA, Head-SCC, Liver-HCC, Lung-AdenoCA, Lung-SCC, Lymph-BNHL,
    # Panc-AdenoCA, Skin-Melanoma, Stomach-AdenoCA, Uterus-AdenoCA
    cancer_types: ["Breast-AdenoCA", "Skin-Melanoma"]

num_muts: []                             # not used: real samples keep their own counts
num_realizations: 1
out_of_reference_sigs: []
out_of_reference_weights: []

random_seed: 0

output_dir: "results_real_pcawg"
log_dir: "logs_real_pcawg"

# ---------------------------------------------------------------------------
# Shared settings (the same in every scenario)
# ---------------------------------------------------------------------------

input_dir: "input"
signature_contributions_dir: "cosmic_tissue_data"
cosmic_signatures:
  base_file: "input/COSMIC_v3.3.1_SBS_GRCh38.txt"
matrix_order: "input/mut_matrix_order_MutationalPatterns.dat"
wgs_or_wes: "WGS"
epsilon: 0.00000001

relevant_signatures: null

evaluation:
  min_contribution: 10.0
  run_bootstrap_quality: false
  num_bootstrap: 1

tool_overrides:
  mutationalpatterns:
    strict: true
  sigminer:
    method: "NNLS"
