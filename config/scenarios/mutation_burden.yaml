# ============================================================================
# Scenario: mutation burden and sampling noise
# How does accuracy change from low-burden samples (exomes, panels) to
# high-burden ones (whole genomes)? Each sample mix is drawn three times
# (num_realizations: 3), so differences caused by chance can be told apart
# from real tool errors.
#
#   snakemake --profile profiles/local-conda --snakefile workflow/Snakefile \
#     --configfile config/scenarios/mutation_burden.yaml
#
# Guide: docs/guide.md#mutation-burden
# ============================================================================

tools_to_run: ["MutationalPatterns", "deconstructSigs", "SPA", "SPA_low", "MuSiCal", "sigminer"]

data_types: ["realsim"]
relevance_modes: ["standard"]

cancer_types: ["Lung-AdenoCA"]
num_muts: [100, 500, 2000, 10000, 50000]
num_samples: 20                          # 20 different signature mixes
num_realizations: 3                      # each mix drawn 3 times with fresh random counts

out_of_reference_sigs: []
out_of_reference_weights: [0]

random_seed: 0

output_dir: "results_mutation_burden"
log_dir: "logs_mutation_burden"

# ---------------------------------------------------------------------------
# Shared settings (the same in every scenario)
# ---------------------------------------------------------------------------

input_dir: "input"
signature_contributions_dir: "cosmic_tissue_data"
cosmic_signatures:
  base_file: "input/COSMIC_v3.3.1_SBS_GRCh38.txt"
matrix_order: "input/mut_matrix_order_MutationalPatterns.dat"
wgs_or_wes: "WGS"
epsilon: 0.00000001

relevant_signatures: null

evaluation:
  min_contribution: 10.0
  run_bootstrap_quality: false
  num_bootstrap: 1

tool_overrides:
  mutationalpatterns:
    strict: true
  sigminer:
    method: "NNLS"
