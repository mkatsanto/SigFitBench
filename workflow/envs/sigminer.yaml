channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - r-base>=4.0
  - r-dplyr
  - r-optparse
  # Without pinning these, conda can solve an env where R's stats.so links
  # against libblas.3.dylib but nothing ships it, breaking every R call.
  - libblas
  - liblapack
  # sigminer and NMF (no osx-arm64 conda build for either) are installed
  # from source by sigminer.post-deploy.sh; r-remotes/r-biocmanager/
  # compilers are for that step.
  - r-remotes
  - r-biocmanager
  - compilers
  # sigminer's remaining Imports, installed via conda so only sigminer
  # itself (and NMF) need to be built in post-deploy.sh.
  - r-cli
  - r-cowplot
  - r-data.table
  - r-furrr
  - r-future
  - r-ggplot2
  - r-ggpubr
  - bioconductor-maftools
  - r-magrittr
  - r-parallelly
  - r-purrr
  - r-rcpp
  - r-rlang
  - r-tidyr
