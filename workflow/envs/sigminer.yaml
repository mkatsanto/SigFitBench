channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - r-base>=4.4
  - r-dplyr
  - r-optparse
  - libblas
  - liblapack
  # sigminer, NMF and maftools are installed by sigminer.post-deploy.sh (conda has no
  # Apple Silicon build of NMF, and its only maftools build would force an old R)
  - r-remotes
  - r-biocmanager
  - compilers
  # Used by sigminer's fitting methods: NNLS, QP and SA
  - r-nnls
  - r-quadprog
  - r-gensa
  # Needed by NMF
  - bioconductor-biobase
  - r-cluster
  # sigminer's other dependencies
  - r-cli
  - r-cowplot
  - r-data.table
  - r-furrr
  - r-future
  - r-ggplot2
  - r-ggpubr
  - r-magrittr
  - r-parallelly
  - r-purrr
  - r-rcpp
  - r-rlang
  - r-tidyr
