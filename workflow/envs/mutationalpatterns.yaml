channels:
  - conda-forge
  - bioconda
  - defaults
channel_priority: strict
dependencies:
  - r-base>=4.0
  - r-cowplot>=0.9.2
  - r-dplyr>=0.8.3
  - r-ggalluvial>=0.12.2
  - r-ggdendro>=0.1_20
  - r-ggplot2>=2.1.0
  - r-magrittr>=1.5
  - r-pracma>=1.8.8
  - r-purrr>=0.3.2
  - r-rcolorbrewer
  - r-stringr>=1.4.0
  - r-tibble>=2.1.3
  - r-tidyr>=1.0.0
  - r-optparse
  # Without pinning these, conda can solve an env where R's stats.so links
  # against libblas.3.dylib but nothing ships it, breaking every R call.
  - libblas
  - liblapack
  # bioconductor-mutationalpatterns and NMF (no osx-arm64 conda build for
  # either) are installed from source by mutationalpatterns.post-deploy.sh;
  # r-remotes/r-biocmanager/compilers are for that step.
  - r-remotes
  - r-biocmanager
  - compilers
  # MutationalPatterns' remaining Imports, installed via conda so only the
  # package itself (and NMF) need to be built in post-deploy.sh.
  - bioconductor-biocgenerics
  - bioconductor-bsgenome
  - bioconductor-variantannotation
  - bioconductor-iranges
  - bioconductor-genomeinfodb
  - bioconductor-biostrings
  - bioconductor-genomicranges
