channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - r-base>=4.0
  - r-dplyr
  - r-optparse
  # Without pinning these, conda can solve an env where R's stats.so links
  # against libblas.3.dylib but nothing ships it, breaking every R call
  # (seen while a transitive post-deploy dependency install loaded stats).
  - libblas
  - liblapack
  # signature.tools.lib and its GitHub-only deps NNLM/indelsig.tools.lib are
  # installed by signature_tools.post-deploy.sh; scripts/signature_tools.R
  # also carries a lazy-install safety net in case that step didn't run.
  - r-remotes
  - r-rcpp
  - r-rcpparmadillo
  - r-rcppprogress
  # compiler toolchain, needed by post-deploy.sh to build NNLM and NMF from
  # source (neither ships an osx-arm64 conda binary)
  - compilers
  # signature.tools.lib's remaining Imports, installed via conda so only
  # the package itself needs to come from GitHub. BSgenome.Hsapiens.* genome
  # data packages (hg38, hs37d5, hg19) are deliberately not listed here:
  # conda's post-link step for genome data uses a bare curl with no retry,
  # so any network hiccup fails the whole env build. Left for post-deploy.sh's
  # remotes::install_github to pull them in via R's retry-friendlier
  # BiocManager-backed installer instead.
  - bioconductor-variantannotation
  - bioconductor-summarizedexperiment
  - bioconductor-biocgenerics
  - bioconductor-genomeinfodb
  - bioconductor-genomicranges
  - bioconductor-iranges
  - bioconductor-bsgenome
  - r-doparallel
  - r-lpsolve
  - r-cluster
  - r-nnls
  - r-gmp
  - r-plyr
  - r-rcircos
  - r-scales
  - r-readr
  - r-dorng
  - r-combinat
  - r-limsolve
  - r-getopt
  - r-circlize
  - r-foreach
  # indelsig.tools.lib Imports (its own DESCRIPTION), pre-installed via conda
  # for the same reason: remotes::install_github would otherwise resolve and
  # compile these -- and their own heavy transitive CRAN dependencies (e.g.
  # factoextra pulling in forecast/reformulas) -- from source, which is what
  # broke the env last time (a from-source build corrupted R's BLAS linkage
  # partway through).
  - r-biocmanager
  - r-ggplot2
  - r-reshape2
  - r-gridextra
  - r-stringr
  - r-factoextra
  - r-rlang
  - bioconductor-biostrings
  - bioconductor-genomicfeatures
