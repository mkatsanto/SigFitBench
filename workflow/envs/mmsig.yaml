channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - r-base>=4.0
  - r-dplyr
  - r-optparse
  # Without pinning these, conda can solve an env where R's stats.so links
  # against libblas.3.dylib but nothing ships it, breaking every R call.
  - libblas
  - liblapack
  # mmsig, MutationalPatterns, and NMF (no osx-arm64 conda build for any of
  # the three) are installed from source by mmsig.post-deploy.sh;
  # r-remotes/r-biocmanager/compilers are for that step.
  - r-remotes
  - r-biocmanager
  - compilers
  # mmsig's remaining Imports, installed via conda so only mmsig itself
  # (and MutationalPatterns/NMF) need to be built in post-deploy.sh.
  - r-seqinr
  - r-plyr
  - r-tibble
  - r-tidyr
  - r-ggplot2
  - r-reshape2
  - r-rcolorbrewer
  - r-deconstructsigs
  - bioconductor-bsgenome
  - bioconductor-genomicfeatures
  - bioconductor-genomicranges
  - bioconductor-iranges
  - bioconductor-genomeinfodb
  # NB: the BSgenome.Hsapiens.UCSC.hg19 and TxDb.Hsapiens.UCSC.hg19.knownGene
  # genome data packages (mmsig's Depends/Imports) are deliberately NOT
  # listed here -- conda's post-link step for these downloads the genome
  # data with a bare curl call with no retry logic, so any network hiccup
  # fails the whole env build (same issue noted in signature_tools.yaml).
  # They're left for mmsig.post-deploy.sh's remotes::install_github to pull
  # in automatically as unmet Imports instead, via R's own (retry-friendlier)
  # BiocManager-backed installer.
  # bioconductor-biocgenerics and bioconductor-variantannotation, needed
  # transitively by MutationalPatterns (see mutationalpatterns.yaml).
  - bioconductor-biocgenerics
  - bioconductor-variantannotation
  - bioconductor-biostrings
